version: '3'

tasks:
  day:
    desc: Create today's practice directory (practice/mar22, etc.)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - mkdir -p practice/{{.PKG}}
      - |
        if [ ! -f practice/{{.PKG}}/doc.go ]; then
          printf 'package %s\n' {{.PKG}} > practice/{{.PKG}}/doc.go
          echo "Created practice/{{.PKG}}"
        else
          echo "practice/{{.PKG}} already exists"
        fi

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...
