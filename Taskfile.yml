version: "3"

tasks:
  day:
    desc: Create today's practice directory (practice/mar22, etc.)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - mkdir -p practice/{{.PKG}}
      - 'echo "Ready: practice/{{.PKG}}"'

  new:
    desc: Create a new topic for today (task new -- topic-name)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - mkdir -p practice/{{.PKG}}/{{.CLI_ARGS}}
      - |
        if [ ! -f practice/{{.PKG}}/{{.CLI_ARGS}}/main.go ]; then
          printf 'package main\n\nfunc main() {}\n' > practice/{{.PKG}}/{{.CLI_ARGS}}/main.go
          echo "Created practice/{{.PKG}}/{{.CLI_ARGS}}/main.go"
        else
          echo "practice/{{.PKG}}/{{.CLI_ARGS}} already exists"
        fi

  run:
    desc: Run a topic (task run -- topic-name)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - go run ./practice/{{.PKG}}/{{.CLI_ARGS}}/

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  anki:build:
    desc: Build and export Anki cards
    cmds:
      - go run ./cmd/anki

  anki:check:
    desc: Lint cards (format + knowledge checks)
    cmds:
      - go run ./cmd/anki

  anki:lint:
    desc: Run Go linter on the anki tooling
    cmds:
      - golangci-lint run ./cmd/anki/... ./internal/...
