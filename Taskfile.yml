version: "3"

tasks:
  day:
    desc: Create today's daily practice directory (practice/daily/mar22, etc.)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - mkdir -p practice/daily/{{.PKG}}
      - 'echo "Ready: practice/daily/{{.PKG}}"'

  new:
    desc: Create a new topic for today (task new -- topic-name)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - mkdir -p practice/daily/{{.PKG}}/{{.CLI_ARGS}}
      - |
        if [ ! -f practice/daily/{{.PKG}}/{{.CLI_ARGS}}/main.go ]; then
          printf 'package main\n\nfunc main() {}\n' > practice/daily/{{.PKG}}/{{.CLI_ARGS}}/main.go
          echo "Created practice/daily/{{.PKG}}/{{.CLI_ARGS}}/main.go"
        else
          echo "practice/daily/{{.PKG}}/{{.CLI_ARGS}} already exists"
        fi

  daily:clean:
    desc: Remove local daily practice while keeping the directory
    cmds:
      - rm -rf practice/daily/*

  run:
    desc: Run a topic (task run -- topic-name)
    vars:
      PKG:
        sh: date +%b%d | tr '[:upper:]' '[:lower:]'
    cmds:
      - go run ./practice/daily/{{.PKG}}/{{.CLI_ARGS}}/

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  reference:test:
    desc: Test all canonical practice examples
    cmds:
      - go test ./practice/reference/...

  anki:build:
    desc: Build and export Anki cards
    cmds:
      - go run ./cmd/anki

  anki:check:
    desc: Lint cards (format + knowledge checks)
    cmds:
      - go run ./cmd/anki

  anki:lint:
    desc: Run Go linter on the anki tooling
    cmds:
      - golangci-lint run ./cmd/anki/... ./internal/...

  anki:release:
    desc: Tag and push a new release (triggers GitHub Actions)
    vars:
      DATE:
        sh: date +%y.%m.%d
      TAG:
        sh: |
          base=$(date +%y.%m.%d)
          if ! git tag -l "$base" | grep -q .; then
            echo "$base"
          else
            n=1
            while git tag -l "${base}.${n}" | grep -q .; do n=$((n+1)); done
            echo "${base}.${n}"
          fi
    cmds:
      - task: anki:build
      - git tag {{.TAG}}
      - git push origin {{.TAG}}
      - echo "Released {{.TAG}}"
